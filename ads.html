<style>

.move-controls { display: flex; gap: 5px; }

dialog { max-width: min(440px, calc(100% - 28px)); padding: 17px; border: 1px solid var(--rule); border-radius: 15px; color: inherit; }

<header><div class="wrap brand"><strong>施術ログ＋</strong><span class="mark">B面</span></div></header>
<main id="app" class="wrap" data-ads="true"></main>

<button data-tab="entry">入力</button>

<script>
'use strict';

const STORAGE_KEY = 'bside-sejutsu-log-plus-v1';
const today = new Intl.DateTimeFormat('sv-SE', {timeZone:'Asia/Tokyo', year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date());
const weekdays = ['日','月','火','水','木','金','土'];
const kinds = {free:'フリー',personal:'個人指名',gender:'性別指名'};
const payFields = {base:'税込換算単価（円／60分）',facility:'施設利用料（円／60分）',material:'固定材料費（円／60分）',personal:'個人指名報酬（円／件）',gender:'性別指名報酬（円／件）'};
const goalFields = {minutes:'総施術時間',personalMinutes:'個人指名施術時間',requests:'指名件数（個人＋性別）',net:'総施術売上（税抜）',holiday:'休日施術売上（税抜）',pay:'報酬金額'};
const historyFields = {minutes:'施術時間',personalMinutes:'個人指名時間',genderMinutes:'性別指名時間',personal:'個人指名件数',gender:'性別指名件数',net:'施術売上（税抜・円）',holiday:'休日施術売上（税抜・円）',pay:'報酬（円）',workDays:'出勤日数',offDays:'休日数'};
const optionalFields = {work:'実際の勤務時間',notes:'日ごとのメモ',requestMinutes:'まとめ入力の指名時間',content:'施術内容',clock:'施術開始時刻',memo:'施術ごとのメモ',options:'オプション欄'};
const isTime = key => ['minutes','personalMinutes','genderMinutes'].includes(key);
const own = (o,k) => Object.hasOwn(o,k);
const obj = v => v !== null && typeof v === 'object' && !Array.isArray(v);
const dateOf = d => new Date(d+'T00:00:00Z');
const dateString = d => d.toISOString().slice(0,10);
const validDate = d => typeof d==='string' && /^\d{4}-\d{2}-\d{2}$/.test(d) && d>='1900-01-01' && d<='2199-12-31' && Number.isFinite(+dateOf(d)) && dateString(dateOf(d))===d;
const validMonth = m => typeof m==='string' && validDate(m+'-01');
const weekday = d => dateOf(d).getUTCDay();
function changeMonth(m,n) {
  const date=dateOf(m+'-01');
  date.setUTCMonth(date.getUTCMonth()+n);
  const result=dateString(date).slice(0,7);
  return validMonth(result)?result:m;
}
function endOfMonth(m) {
  const date=dateOf(m+'-01');
  date.setUTCMonth(date.getUTCMonth()+1,0);
  return dateString(date);
}
const check = (ok,msg='バックアップの形式を確認してください。') => {if(!ok)throw new Error(msg)};
const finite = (v,min=0,max=1e9) => Number.isFinite(v) && v>=min && v<=max;
const integer = (v,max=1e9) => Number.isInteger(v) && finite(v,0,max);
const nullable = (v,test) => v===null || test(v);
const clock = v => typeof v==='string' && /^(?:[01]\d|2[0-3]):[0-5]\d$/.test(v);
function normalizeClock(value) {
  const raw=value.trim();
  if(!raw)return '';
  const match=/^(\d{1,2}):?(\d{2})$/.exec(raw);
  if(!match)return null;
  const formatted=match[1].padStart(2,'0')+':'+match[2];
  return clock(formatted)?formatted:null;
}
const clockMinutes = v => +v.slice(0,2)*60 + +v.slice(3);
const clockSpan = (a,b) => (clockMinutes(b)-clockMinutes(a)+1440)%1440;
const textOK = v => typeof v==='string' && v.length<=10000;
const idOK = v => typeof v==='string' && /^[\w-]{1,100}$/.test(v) && !['__proto__','constructor','prototype'].includes(v);
const sum = (rows,fn) => rows.reduce((total,row)=>total+fn(row),0);
function optionalSum(values) {
  const known=values.filter(v=>v!==null);
  return known.length?sum(known,v=>v):null;
}
const completeSum = values => values.includes(null)?null:sum(values,v=>v);
const uid = () => crypto.randomUUID?.() ?? 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2);
const legacyOptions = () => [{id:'mattress',name:'プレミアムマットレス',share:0}];
function initialState() {
  return {format:STORAGE_KEY,version:1,stores:[{id:'store1',name:'店舗A'}],settings:{base:3600,facility:212,material:108,personal:0,gender:0,options:legacyOptions()},rates:{},days:{},deposits:{},history:{},carry:null,goals:[],showGoals:true,holidays:[0,6],holidayDates:[],hidden:[]};
}
function snapshot(state,date) {
  return {...structuredClone(state.settings),rate:state.rates[date.slice(0,7)]??null};
}
function blankEntry(state,date,store=state.stores[0].id) {
  return {store,mode:'summary',minutes:0,personal:0,gender:0,personalMinutes:null,genderMinutes:null,counts:{},work:{mode:'clock',start:'',end:'',breaks:0,total:null},details:[],pay:snapshot(state,date)};
}
function blankDetail() {
  return {time:'',minutes:60,content:'',kind:'free',charge:null,options:[],memo:''};
}
function detailTotals(items) {
  const counts={};
  for(const item of items) for(const id of item.options) counts[id]=(counts[id]??0)+1;
  return {minutes:sum(items,v=>v.minutes),personal:items.filter(v=>v.kind==='personal').length,gender:items.filter(v=>v.kind==='gender').length,
    personalMinutes:sum(items,v=>v.kind==='personal'?v.minutes:0),genderMinutes:sum(items,v=>v.kind==='gender'?v.minutes:0),counts};
}
function entryTotals(e) {
  const detail=detailTotals(e.details);
  const count=e.mode==='detail'?detail:e;
  const actualItems=e.details.filter(d=>d.charge!==null);
  const actual=sum(actualItems,d=>d.charge);
  const actualMinutes=sum(actualItems,d=>d.minutes);
  const estimated=Math.max(0,count.minutes-actualMinutes)*e.pay.base/60;
  const gross=actual+estimated;
  const source=!count.minutes&&!actualItems.length?'none':actualItems.length?(actualMinutes===count.minutes?'actual':'mixed'):'estimate';
  const options=sum(e.pay.options,o=>(count.counts[o.id]??0)*o.share);
  const facility=count.minutes/60*e.pay.facility;
  const material=count.minutes/60*e.pay.material;
  const personalPay=count.personal*e.pay.personal;
  const genderPay=count.gender*e.pay.gender;
  const system=e.pay.rate===null?null:gross*e.pay.rate/100;
  const pay=system===null?null:gross*(1-e.pay.rate/100)-facility-material+personalPay+genderPay+options;
  const work=e.work.mode==='total'?e.work.total:(clock(e.work.start)&&clock(e.work.end)?Math.max(0,clockSpan(e.work.start,e.work.end)-e.work.breaks):null);
  const personalMissing=count.personalMinutes===null&&detail.personal<count.personal;
  const genderMissing=count.genderMinutes===null&&detail.gender<count.gender;
  return {minutes:count.minutes,personal:count.personal,gender:count.gender,
    personalMinutes:count.personalMinutes??(personalMissing&&!detail.personal?null:detail.personalMinutes),
    genderMinutes:count.genderMinutes??(genderMissing&&!detail.gender?null:detail.genderMinutes),
    personalMissing,genderMissing,counts:count.counts,actual,estimated,gross,net:gross/1.1,source,options,facility,material,personalPay,genderPay,system,pay,work};
}
const isHoliday = (state,d) => state.holidays.includes(weekday(d)) || state.holidayDates.includes(d);
function dailyRows(state, date, day, store='') {
  if(day.status==='off') return [];
  return day.entries.filter(e=>!store||e.store===store).map(e=>({date,...entryTotals(e),holiday:isHoliday(state,date)}));
}
function groupTotals(rows,offDays=0) {
  const minutes=sum(rows,r=>r.minutes);
  const work=optionalSum(rows.map(r=>r.work));
  const knownWork=rows.filter(r=>r.work!==null);
  return {minutes,work,workMissing:rows.length-knownWork.length,utilization:work>0?sum(knownWork,r=>r.minutes)/work:null,
    personalMinutes:optionalSum(rows.map(r=>r.personalMinutes)),
    genderMinutes:optionalSum(rows.map(r=>r.genderMinutes)),
    personalMissing:rows.some(r=>r.personalMissing),genderMissing:rows.some(r=>r.genderMissing),
    personal:sum(rows,r=>r.personal),gender:sum(rows,r=>r.gender),
    net:sum(rows,r=>r.net),holiday:sum(rows,r=>r.holiday?r.net:0),pay:completeSum(rows.map(r=>r.pay)),
    workDays:new Set(rows.map(r=>r.date)).size,offDays,records:rows.length};
}
function monthTotals(state,month,store='') {
  const days=Object.entries(state.days).filter(([date])=>date.startsWith(month));
  if(!days.length&&!store&&own(state.history,month)) {
    return {...state.history[month],historic:true,work:null,utilization:null,workMissing:0,records:1};
  }
  return groupTotals(days.flatMap(([date,day])=>dailyRows(state,date,day,store)),store?0:days.filter(([,d])=>d.status==='off').length);
}
const allMonths = state => [...new Set([...Object.keys(state.history),...Object.keys(state.days).map(d=>d.slice(0,7))])].sort();
function goalProgress(state,g) {
  const days=Object.entries(state.days).filter(([d])=>g.from<=d&&d<=g.to);
  const dayTotals=groupTotals(days.flatMap(([d,v])=>dailyRows(state,d,v)));
  const months=allMonths(state).filter(m=>g.from<=m+'-01'&&endOfMonth(m)<=g.to).map(m=>monthTotals(state,m)).filter(m=>m.historic);
  const read = r => g.metric==='requests'?nullableAdd(r.personal,r.gender):r[g.metric];
  const values=[...(dayTotals.records?[read(dayTotals)]:[]),...months.map(read)];
  const partial=values.includes(null)||(g.metric==='personalMinutes'&&dayTotals.personalMissing);
  return {value:values.length?optionalSum(values):0,partial};
}
function nullableAdd(a,b) {return a===null||b===null?null:a+b}
function validateSettings(s,withRate=false) {
  check(obj(s)&&Object.keys(payFields).every(k=>finite(s[k]))&&Array.isArray(s.options));
  const ids=new Set();
  for(const o of s.options) {
    check(obj(o)&&idOK(o.id)&&!ids.has(o.id)&&textOK(o.name)&&o.name.trim()&&finite(o.share));
    ids.add(o.id);
  }
  if(withRate)check(nullable(s.rate,v=>finite(v,0,100)));
}
function validateEntry(e,stores) {
  check(obj(e)&&stores.includes(e.store)&&['summary','detail'].includes(e.mode));
  validateSettings(e.pay,true);
  const options=e.pay.options.map(o=>o.id);
  check(integer(e.minutes,1440)&&integer(e.personal)&&integer(e.gender)&&obj(e.counts)&&Object.entries(e.counts).every(([k,v])=>options.includes(k)&&integer(v)));
  check(nullable(e.personalMinutes,v=>integer(v,1440))&&nullable(e.genderMinutes,v=>integer(v,1440)));
  check(obj(e.work)&&['clock','total'].includes(e.work.mode)&&nullable(e.work.total,v=>integer(v,1440))&&integer(e.work.breaks,1440));
  check([e.work.start,e.work.end].every(v=>v===''||clock(v)));
  check(Array.isArray(e.details)&&e.details.every(d=>obj(d)&&(d.time===''||clock(d.time))&&integer(d.minutes,1440)&&d.minutes>0&&own(kinds,d.kind)&&textOK(d.content)&&textOK(d.memo)&&nullable(d.charge,integer)&&Array.isArray(d.options)&&new Set(d.options).size===d.options.length&&d.options.every(id=>options.includes(id))));
  if(e.mode==='summary') {
    const detail=detailTotals(e.details);
    check(detail.minutes<=e.minutes,'個別の施術時間の合計を、まとめ入力の合計施術時間以内にしてください。');
    check(detail.personal<=e.personal&&detail.gender<=e.gender,'個別の指名件数を、まとめ入力の指名件数以内にしてください。');
    check(Object.entries(detail.counts).every(([k,count])=>count<=(e.counts[k]??0)),'個別のオプション件数を、まとめ入力の件数以内にしてください。');

function migrateLegacy(raw) {
  check(obj(raw)&&(raw.version===1||raw.version===undefined)&&Array.isArray(raw.stores)&&raw.stores.length>0&&obj(raw.settings)&&obj(raw.rates)&&obj(raw.days),'通常版の施術ログから書き出したJSONを選んでください。');
  const s=initialState();
  s.stores=structuredClone(raw.stores);
  for(const k of Object.keys(payFields)) {
    check((typeof raw.settings[k]==='number'||typeof raw.settings[k]==='string')&&String(raw.settings[k]).trim()!==''&&finite(Number(raw.settings[k])));
    s.settings[k]=Number(raw.settings[k]);
  }
  if(raw.settings.mattress!==undefined) {
    check(finite(Number(raw.settings.mattress)));
    s.settings.options[0].share=Number(raw.settings.mattress);
  }
  for(const [m,v] of Object.entries(raw.rates)) {
    check(validMonth(m));
    if(v!==null&&v!=='') {check(finite(Number(v),0,100));s.rates[m]=Number(v)}
  }

    check(validDate(date)&&obj(day)&&['work','off'].includes(day.status)&&Array.isArray(day.entries));
    const entries=day.status==='off'?[]:day.entries.map(o=>{
      check(obj(o)&&idOK(o.store));
      if(!s.stores.some(store=>store.id===o.store))s.stores.push({id:o.store,name:'旧店舗（'+o.store+'）'});
      const entry=blankEntry(s,date,o.store);
      const oldClock = v => {
        if(!v)return '';
        const m=/^(\d{1,2}):?(\d{2})$/.exec(v);
        const result=m?m[1].padStart(2,'0')+':'+m[2]:'';
        return clock(result)?result:'';
      };
      return {...entry,minutes:Number(o.minutes),personal:Number(o.personal??0),gender:Number(o.gender??0),counts:{mattress:Number(o.mattress??0)},
        work:{...entry.work,start:oldClock(o.start),end:oldClock(o.end),breaks:Number(o.breaks??0)}};
    });
    const notes=Array.isArray(day.notes)?day.notes.map(n=>({mark:n?.mark==='⭐'?'⭐':'📝',text:String(n?.text??'')})):day.note?[{mark:'📝',text:String(day.note)}]:[];
    s.days[date]={status:day.status,entries,notes};
  }

function mergeLegacy(current,source) {
  const next=structuredClone(current);
  const aliases=new Map();
  for(const s of source.stores) {
    const exact=next.stores.find(t=>t.id===s.id&&t.name===s.name);
    const migratedId='old-'+s.id.slice(0,95);
    let id=exact?.id??(next.stores.some(t=>t.id===s.id)?migratedId:s.id);
    if(!exact) {
      let suffix=1;
      while(next.stores.some(t=>t.id===id&&t.name!==s.name))id=migratedId.slice(0,93)+'-'+suffix++;
      if(!next.stores.some(t=>t.id===id))next.stores.push({...s,id});
    }
    aliases.set(s.id,id);
  }
  const unused=JSON.stringify(current)===JSON.stringify(initialState());
  if(unused) {
    next.stores=structuredClone(source.stores);
    for(const s of source.stores)aliases.set(s.id,s.id);
    next.settings=structuredClone(source.settings);
    next.rates=structuredClone(source.rates);
  }
  let added=0,skipped=0;
  for(const [date,day] of Object.entries(source.days)) {
    if(own(next.days,date)){skipped++;continue}
    next.days[date]={...day,entries:day.entries.map(e=>({...e,store:aliases.get(e.store)}))};
    added++;
  }
  return {next,added,skipped,adoptsSettings:unused};
}

    ['施術売上（税抜）',yen(total.net)],['休日施術売上（税抜）',yen(total.holiday)],

function monthlyPayLines(total) {
  const entries=Object.entries(state.days).filter(([d,v])=>d.startsWith(month)&&v.status==='work')
    .flatMap(([,v])=>v.entries.filter(e=>!filterStore||e.store===filterStore));
  const rows=entries.map(entryTotals);
  const amount=key=>total.historic?null:sum(rows,row=>row[key]);
  const countAndPay=(count,pay)=>qty(count)+(pay===null?'':'　'+yen(pay));
  const mattress={count:0,pay:0};
  const extras=new Map();
  entries.forEach((e,i)=>{
    for(const option of e.pay.options) {
      const count=rows[i].counts[option.id]??0;
      if(!count)continue;
      const target=option.id==='mattress'||option.name==='プレミアムマットレス'?mattress:
        (extras.get(option.name)??{count:0,pay:0});
      target.count+=count;
      target.pay+=count*option.share;
      if(target!==mattress)extras.set(option.name,target);
    }
  });
  return lines([
    ['出勤日数',daysFmt(total.workDays)],['休みの日数',filterStore?'対象外':daysFmt(total.offDays)],
    ['個人指名',countAndPay(total.personal,amount('personalPay'))],['性別指名',countAndPay(total.gender,amount('genderPay'))],
    ['プレミアムマットレス',total.historic?'未記録':countAndPay(mattress.count,mattress.pay)],
    ...[...extras].map(([label,v])=>[esc(label),countAndPay(v.count,v.pay)]),
    ['施設利用料',yen(amount('facility'))],['固定材料費',yen(amount('material'))]
  ]);
}

function annualTotals(year) {
  const rows=allMonths(state).filter(m=>m.startsWith(year)).map(m=>monthTotals(state,m));
  const total=Object.fromEntries(Object.keys(historyFields).map(k=>[k,optionalSum(rows.map(r=>r[k]))]));
  total.pay=rows.length?completeSum(rows.map(r=>r.pay)):null;
  total.personalMissing=rows.some(r=>r.personalMissing||r.personalMinutes===null);
  total.genderMissing=rows.some(r=>r.genderMissing||r.genderMinutes===null);
  total.historic=true;
  return total;
}
function metricText(key,value) {
  if(isTime(key))return hours(value);
  return key==='requests'?qty(value):yen(value);
}
function goalCard(goal) {
  const p=goalProgress(state,goal);
  const percent=p.value===null?null:100*p.value/goal.target;
  return '<div class="record goal"><div class="line"><strong>'+goalFields[goal.metric]+'</strong><span>'+(percent===null?'未記録':num(percent,1)+'%')+'</span></div>'+
    '<p class="sub">'+goal.from+' 〜 '+goal.to+'</p>'+
    '<strong>'+metricText(goal.metric,p.value)+' ／ '+metricText(goal.metric,goal.target)+'</strong>'+
    '<progress max="100" value="'+Math.max(0,Math.min(100,percent??0))+'" aria-label="目標達成率"></progress>'+
    '<p class="sub">'+(p.partial?'記録できた分で集計しています。 ':'')+
    (p.value===null?'':p.value>=goal.target?'目標達成！':'目標まであと '+metricText(goal.metric,goal.target-p.value))+'</p></div>';
}

    '<div class="chart">'+items.map((m,i)=>button('<i style="--h:'+Math.round(Math.max(0,vals[i]??0)/max*72)+'px"></i><span>'+(i+1)+'月</span>',
      'review-month','data-month="'+m+'" aria-label="'+monthLabel(m)+' '+(chartMetric==='minutes'?hours(vals[i]):yen(vals[i]))+'" title="'+(chartMetric==='minutes'?hours(vals[i]):yen(vals[i]))+'"','bar'+(m===reviewMonth?' active':''))).join('')+'</div>';

function ranks() {
  const daily=Object.entries(state.days).filter(([,d])=>d.status==='work').map(([d,v])=>[d,groupTotals(dailyRows(state,d,v))]);
  const monthly=allMonths(state).map(m=>[m,monthTotals(state,m)]).filter(([,v])=>v.records);
  const rankings=[
    ['1日で一番揉んだ日',daily,v=>v.minutes,mins],
    ['1日で一番個人指名を揉んだ日',daily,v=>v.personalMissing?null:v.personalMinutes,mins],
    ['1日で一番指名が多かった日',daily,v=>v.personal+v.gender,qty],
    ['1日で一番稼いだ日',daily,v=>v.pay,yen,true],
    ['一番揉んだ月',monthly,v=>v.minutes,hours],
    ['一番稼いだ月',monthly,v=>v.pay,yen,true]
  ];
  return rankings.map(([label,rows,read,fmt,allowNegative])=>{
    const top=rows.map(([k,v])=>[k,read(v)]).filter(([,v])=>v!==null&&(allowNegative||v>0))
      .sort(([da,a],[db,b])=>b-a||db.localeCompare(da)).slice(0,5);
    return '<details class="record"><summary>'+label+(top.length?' ／ '+fmt(top[0][1]):' ／ 記録なし')+'</summary><div class="stack">'+
      (top.length?top.map(([key,v],i)=>button('<span>'+(i+1)+'位　'+(key.length===7?monthLabel(key):key)+'</span><strong>'+fmt(v)+'</strong>',
        'rank-open','data-key="'+key+'"','rank line')).join(''):'<p class="sub">集計できる記録がありません。</p>')+'</div></details>';
  }).join('');
}

function render() {

    const card=el.closest('[data-detail]');
    const row=el.closest('[data-entry]');

  });
  const openMonth=[...app.querySelectorAll('[data-print-expand][open]')].map(el=>el.dataset.fold);
  const settingsOpen=[...app.querySelectorAll('[data-setting][open]')].map(el=>el.dataset.setting);

    ({entry:entryScreen,month:monthScreen,review:reviewScreen,settings:settingsScreen}[tab])();
  if(tab==='entry')for(const el of app.querySelectorAll('.entry-panel details')) {
    const card=el.closest('[data-detail]');
    const row=el.closest('[data-entry]');
    const key=[row?.dataset.entry,card?.dataset.detail,el.dataset.fold??el.querySelector('summary')?.textContent.split('（')[0]].join('|');
    if(openedEntry.includes(key))el.open=true;

}
function refreshCharge(card,d,e) {
  if(d.charge===null)card.querySelector('[name="charge"]').value=Math.round(d.minutes*e.pay.base/60);
  card.querySelector('.charge-status').textContent=d.charge===null?'概算料金':'実入力料金';
}
function editInput(el) {
  if(el.name==='entryDate')return;
  if(el.hasAttribute('data-clock')) {
    if(el.value.length===4&&el.selectionStart===4)el.value=normalizeClock(el.value)??el.value;
    el.removeAttribute('aria-invalid');
  }
  const note=el.closest('[data-note]');
  if(note) {
    const n=draft.notes[+note.dataset.note];
    if(el.name==='noteMark')n.mark=el.value;
    if(el.name==='noteText')n.text=el.value;
    dirty=true;
    return;
  }
  const row=el.closest('[data-entry]');
  if(!row)return;
  const e=draft.entries[+row.dataset.entry];
  const card=el.closest('[data-detail]');
  if(card) {
    const d=e.details[+card.dataset.detail];
    if(el.name==='option')d.options=[...card.querySelectorAll('[name="option"]:checked')].map(input=>input.value);
    else if(el.name==='charge') {
      d.charge=maybeNumber(el.value);
      card.querySelector('.charge-status').textContent=d.charge===null?'概算料金':'実入力料金';
    } else {
      d[el.name]=el.name==='minutes'?Number(el.value):el.value;
      if(el.name==='minutes')refreshCharge(card,d,e);
    }
  } else if(el.name.startsWith('work.')) {
    const key=el.name.slice(5);
    if(key==='mode') {
      if(el.value==='total'&&e.work.total===null)e.work.total=entryTotals(e).work;
      e.work.mode=el.value;
      dirty=true;
      render();
      return;
    }
    if(['hours','minutes'].includes(key)) {
      const a=row.querySelector('[name="work.hours"]').value,b=row.querySelector('[name="work.minutes"]').value;
      e.work.total=a===''&&b===''?null:Number(a)*60+Number(b);
    } else e.work[key]=key==='breaks'?Number(el.value):el.value;
  } else if(el.name==='store') {
    e.store=el.value;
    dirty=true;
    render();
    return;
  } else {
    e[el.name]=el.name==='minutes'?Number(el.value):maybeNumber(el.value);
  }
  dirty=true;
  updateEstimate();
}
function checkedClock(value,label) {
  const time=normalizeClock(value);
  check(time!==null,label+'は24時間表記で入力してください（例 1330、13:30）。');
  return time;
}
function sortDetailsByTime(details) {
  const sortKey=detail=>normalizeClock(detail.time)||'99:99';
  details.sort((a,b)=>sortKey(a).localeCompare(sortKey(b)));
}
function saveDay() {
  check(validDate(date),'日付を確認してください。');
  const day=structuredClone(draft);
  if(day.status==='off')day.entries=[];
  for(const e of day.entries) {
    e.work.start=checkedClock(e.work.start,'出勤時刻');
    e.work.end=checkedClock(e.work.end,'退勤時刻');
    e.details.forEach((detail,i)=>{detail.time=checkedClock(detail.time,'施術 '+(i+1)+' の開始時刻');});
    check(e.mode!=='detail'||e.details.length>0,'個別の施術を追加するか、1日まとめて入力を選んでください。');
    check(e.details.every(d=>integer(d.minutes,1440)&&d.minutes>0&&nullable(d.charge,integer)),'個別の施術時間・税込料金を確認してください。');
    check(integer(e.minutes,1440)&&nullable(e.personalMinutes,v=>integer(v,1440))&&nullable(e.genderMinutes,v=>integer(v,1440)),'施術時間・指名時間は0〜1440の整数で入力してください。');
    if(e.work.mode==='clock'&&e.work.start&&e.work.end) {
      check(clockSpan(e.work.start,e.work.end)>0,'出勤と退勤の時刻を確認してください。');
      check(e.work.breaks<=clockSpan(e.work.start,e.work.end),'勤務時間より休憩時間が長くなっています。');
    }
    check(nullable(e.work.total,v=>integer(v,1440))&&integer(e.work.breaks,1440),'勤務時間を確認してください。');
    validateEntry(e,state.stores.map(s=>s.id));
  }
  day.notes=day.notes.filter(n=>n.text.trim()).map(n=>({...n,text:n.text.trim()}));
  const historyOverlaps=!own(state.days,date)&&own(state.history,date.slice(0,7));
  if(historyOverlaps&&!confirm('同じ月に過去実績があります。この日を保存すると、この月の集計は日別記録に切り替わります。保存しますか？'))return;
  const next=structuredClone(state);
  next.days[date]=day;
  persist(next);
  draft=loadDay(date);
  dirty=false;
  render();
  notice('保存されました\nお疲れ様でした。',false,2600);
}

function handler(entry,card,key,b) {
  const e=entry?draft.entries[+entry.dataset.entry]:null;
  const item=card?e.details[+card.dataset.detail]:null;
  switch(key) {
    case 'status':if(draft.status===b.dataset.status)return;draft.status=b.dataset.status;break;
    case 'entry-add':{
      const store=state.stores.find(s=>!draft.entries.some(e=>e.store===s.id));
      if(!store)return;
      draft.entries.push(blankEntry(state,date,store.id));
      break;
    }
    case 'entry-remove':
      if(draft.entries.length===1)throw new Error('出勤記録には店舗枠を1つ入力してください。');
      if(!confirm('この店舗枠を外しますか？'))return;
      draft.entries.splice(+entry.dataset.entry,1);break;
    case 'mode':
      if(e.mode===b.dataset.mode)return;
      if(b.dataset.mode==='detail'&&(e.minutes||e.personal||e.gender||Object.values(e.counts).some(Boolean))&&
        !confirm('この店舗枠の集計を、個別記録のみで計算しますか？ まとめの入力は編集画面に保持されます。'))return;
      if(b.dataset.mode==='summary'&&!e.minutes&&e.details.length) {
        Object.assign(e,detailTotals(e.details));
      }
      e.mode=b.dataset.mode;
      if(e.mode==='detail'&&!e.details.length)e.details.push(blankDetail());
      break;
    case 'count':{
      const name=b.dataset.key;
      const obj=name.startsWith('option-')?e.counts:e;
      const k=obj===e?name:name.slice(7);
      const v=Math.min(1e9,Math.max(0,(obj[k]??0)+Number(b.dataset.delta)));
      obj[k]=v;
      entry.querySelector('[data-count-value="'+name+'"]').textContent=v;
      dirty=true;
      updateEstimate();
      return;
    }
    case 'detail-add':e.details.push(blankDetail());break;
    case 'detail-move':{
      const from=Number(card.dataset.detail);
      const to=from+Number(b.dataset.delta);
      if(to<0||to>=e.details.length)return;
      [e.details[from],e.details[to]]=[e.details[to],e.details[from]];
      dirty=true;
      render();
      const moved=app.querySelector('[data-entry="'+entry.dataset.entry+'"] [data-detail="'+to+'"]');
      const controls=moved?.querySelectorAll('[data-action="detail-move"]:enabled');
      const direction=moved?.querySelector('[data-action="detail-move"][data-delta="'+b.dataset.delta+'"]:enabled');
      (direction??controls?.[0])?.focus();
      return;
    }
    case 'detail-sort':{
      sortDetailsByTime(e.details);
      dirty=true;
      render();
      app.querySelector('[data-entry="'+entry.dataset.entry+'"] [data-action="detail-sort"]')?.focus();
      return;
    }
    case 'detail-remove':
      if(!confirm('この施術を外しますか？'))return;
      e.details.splice(+card.dataset.detail,1);break;
    case 'estimate-reset':item.charge=null;refreshCharge(card,item,e);dirty=true;updateEstimate();return;
    case 'note-add':draft.notes.push({mark:'📝',text:''});break;
    case 'note-remove':draft.notes.splice(+b.closest('[data-note]').dataset.note,1);break;
    case 'save-day':saveDay();return;
    case 'delete-day':
      if(!confirm(date+'の記録を削除しますか？'))return;
      changeState(next=>{delete next.days[date]},'日別記録を削除しました',false);
      draft=loadDay(date);dirty=false;render();return;
    case 'show-day':detailDate=b.dataset.date;render();$('selected-day')?.scrollIntoView({block:'start'});return;
    case 'edit-day':openDate(b.dataset.date);return;
    case 'review-month':reviewMonth=b.dataset.month;render();return;
    case 'rank-open':
      month=b.dataset.key.slice(0,7);detailDate=b.dataset.key.length===10?b.dataset.key:'';filterStore='';go('month');
      if(detailDate)$('selected-day')?.scrollIntoView({block:'start'});
      return;
    case 'apply-rate':{
      const rate=state.rates[rateMonth];
      check(rate!==undefined,'この月の利用料率を先に保存してください。');
      if(!confirm('この月の料率が未設定の記録に '+num(rate,4)+'% を適用しますか？'))return;
      changeState(next=>{
        for(const [d,day] of Object.entries(next.days))if(d.startsWith(rateMonth)) {
          for(const e of day.entries)if(e.pay.rate===null)e.pay.rate=rate;
        }
      },'未設定の記録に料率を適用しました');
      return;
    }
    case 'remove-option':
      if(confirm('このオプションを今後の入力欄から外しますか？'))changeState(next=>{next.settings.options=next.settings.options.filter(o=>o.id!==b.dataset.id)});
      return;
    case 'remove-goal':
      if(confirm('この目標を削除しますか？'))changeState(next=>{next.goals=next.goals.filter(g=>g.id!==b.dataset.id)});
      return;
    case 'history-remove':
      if(confirm('この月の過去実績を削除しますか？'))changeState(next=>{delete next.history[historyMonth]});
      return;
    case 'open-reset':$('reset-dialog').showModal();return;
    case 'cancel-reset':$('reset-dialog').close();return;
    case 'confirm-reset':
      if(!$('reset-dialog')?.open)return;
      changeState(next=>{next.days={};next.deposits={};next.history={};next.carry=null;},'施術ログ＋の全記録を削除しました',false);
      draft=loadDay(date);dirty=false;detailDate='';render();return;
    case 'backup':download('施術ログプラス_'+today+'.json','application/json',JSON.stringify(state,null,2));return;
    case 'csv':exportCsv();return;
    case 'hourly':exportHourly();return;
    case 'print':window.print();return;
    default:return;
  }
  dirty=true;
  render();
}
function submitForm(f) {
  const fd=new FormData(f);
  const vals=Object.fromEntries(fd);
  switch(f.dataset.form) {
    case 'depositForm':
      return changeState(next=>{
        if(vals.amount===''&&!vals.paidDate){delete next.deposits[month];return;}
        next.deposits[month]={amount:maybeNumber(vals.amount),date:vals.paidDate};
      });
    case 'payForm':
      return changeState(next=>{for(const k of Object.keys(payFields))next.settings[k]=Number(vals[k]);});
    case 'rateForm':
      return changeState(next=>{next.rates[vals.rateMonth]=Number(vals.rate);},'月の利用料率を保存しました');
    case 'storeEdit':
      check(vals.name.trim(),'店舗名を入力してください。');
      return changeState(next=>{
        if(f.dataset.id)next.stores.find(s=>s.id===f.dataset.id).name=vals.name.trim();
        else next.stores.push({id:uid(),name:vals.name.trim()});
      });
    case 'optionEdit':
      check(vals.name.trim(),'オプション名を入力してください。');
      return changeState(next=>{
        const item={id:f.dataset.id??uid(),name:vals.name.trim(),share:Number(vals.share)};
        const idx=next.settings.options.findIndex(o=>o.id===item.id);
        if(idx>=0)next.settings.options[idx]=item;
        else next.settings.options.push(item);
      });
    case 'holidayForm':{
      const dates=[...new Set(vals.holidayDates.split(/\s+/).filter(Boolean))];
      check(dates.every(validDate),'追加対象日は YYYY-MM-DD の形式で入力してください。');
      return changeState(next=>{next.holidays=fd.getAll('weekday').map(Number);next.holidayDates=dates;next.showGoals=fd.has('showGoals');});
    }
    case 'goalEdit':{
      check(validDate(vals.from)&&validDate(vals.to)&&vals.from<=vals.to,'目標期間を確認してください。');
      const target=isTime(vals.metric)?Math.round(Number(vals.target)*60):Number(vals.target);
      check(finite(target,.01),'目標値は0より大きくしてください。');
      const g={id:f.dataset.id??uid(),metric:vals.metric,from:vals.from,to:vals.to,target};
      return changeState(next=>{next.goals=[...next.goals.filter(o=>o.id!==g.id),g]});
    }
    case 'hideForm':
      return changeState(next=>{next.hidden=Object.keys(optionalFields).filter(k=>!fd.getAll('showField').includes(k));});
    case 'historyForm':{
      const row=Object.fromEntries(Object.keys(historyFields).map(k=>[k,vals[k]===''?null:isTime(k)?Math.round(Number(vals[k])*60):Number(vals[k])]));
      check(Object.values(row).some(v=>v!==null),'登録する実績を1つ以上入力してください。');
      return changeState(next=>{next.history[historyMonth]=row});
    }
    case 'carryForm':{
      const both=vals.carryMonth&&vals.carryHours!=='';
      check(both||(!vals.carryMonth&&vals.carryHours===''),'基準月と累計時間をセットで入力してください。');
      return changeState(next=>{next.carry=both?{month:vals.carryMonth,minutes:Math.round(Number(vals.carryHours)*60)}:null});
    }
  }
}
function download(name,type,content) {
  const url=URL.createObjectURL(new Blob([content],{type}));
  const a=document.createElement('a');
  a.href=url;a.download=name;
  document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
}

function exportHourly() {
  const table=new Map();

    ...[...table.values()].sort((a,b)=>a.date.localeCompare(b.date)||a.store.localeCompare(b.store)||a.hour.localeCompare(b.hour))
      .map(r=>[r.date,r.store,r.hour+'時台',r.free,r.personal,r.gender])];
  download('施術ログプラス_時間帯別_'+month+'.csv','text/csv;charset=utf-8','\uFEFF'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n')+'\r\n');
}
async function importFile(el) {
  const file=el.files?.[0];
  if(!file)return;
  try {
    check(file.size<=20*1024*1024,'20MB以下のJSONを選んでください。');
    const raw=JSON.parse(await file.text());
    if(el.name==='restore') {
      const next=validateState(raw);
      if(!confirm('施術ログ＋の記録と設定を、このバックアップの内容に置き換えますか？'))return;
      persist(next,true);
      notice('バックアップを復元しました');
    } else {
      const result=mergeLegacy(state,migrateLegacy(raw));
      if(!result.added&&!result.adoptsSettings){notice('追加できる日付はありません。既存の日付 '+result.skipped+'件');return;}
      if(!confirm('日別記録を '+result.added+'日追加します。既存の日付 '+result.skipped+'日は残します。'+(result.adoptsSettings?' 店舗・報酬設定も引き継ぎます。':'')+' 取り込みますか？'))return;
      persist(result.next);
      notice(result.added+'日を取り込みました。既存の日付 '+result.skipped+'日');
    }
    draft=loadDay(date);
    dirty=false;
    if(filterStore&&!state.stores.some(s=>s.id===filterStore))filterStore='';
    render();
  } catch(e) {
    notice(e instanceof SyntaxError?'JSONを読み取れませんでした。現在の記録はそのままです。':e.message,true);
  } finally {el.value='';}
}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab)));
app.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-action]');
  if(!b)return;
  try {handler(b.closest('[data-entry]'),b.closest('[data-detail]'),b.dataset.action,b)} catch(e){notice(e.message,true)}
});
app.addEventListener('input',ev=>{
  if(tab==='entry'&&ev.target.matches('input,select,textarea'))editInput(ev.target);
});
app.addEventListener('focusout',ev=>{
  const el=ev.target;
  if(!el.matches('input[data-clock]'))return;
  const formatted=normalizeClock(el.value);
  if(formatted===null)el.setAttribute('aria-invalid','true');
  else if(el.value!==formatted) {
    el.value=formatted;
    editInput(el);
  }
});
app.addEventListener('change',ev=>{
  const el=ev.target;
  switch(el.name) {
    case 'entryDate':if(validDate(el.value))openDate(el.value);el.value=date;break;
    case 'monthView':if(validMonth(el.value))setViewMonth(el.value);break;
    case 'storeFilter':filterStore=el.value;render();break;
    case 'reviewMonth':if(validMonth(el.value)){reviewMonth=el.value;render();}break;
    case 'rateMonth':if(validMonth(el.value)){rateMonth=el.value;render();}break;
    case 'historyMonth':if(validMonth(el.value)){historyMonth=el.value;render();}break;
    case 'chartMetric':chartMetric=el.value;render();break;
    case 'restore':case 'legacy':void importFile(el);break;
    case 'charge': {
      const card=el.closest('[data-detail]');
      const entry=draft.entries[+card.closest('[data-entry]').dataset.entry];
      refreshCharge(card,entry.details[+card.dataset.detail],entry);
      break;
    }
  }
});
app.addEventListener('submit',ev=>{
  ev.preventDefault();
  try {submitForm(ev.target);} catch(e){notice(e.message,true)}
});
let printOpened=[];
window.addEventListener('beforeprint',()=>{
  printOpened=[...app.querySelectorAll('[data-print-expand]:not([open])')];
  for(const el of printOpened)el.open=true;
});
window.addEventListener('afterprint',()=>{
  for(const el of printOpened)el.open=false;
  printOpened=[];
});
window.addEventListener('beforeunload',ev=>{if(dirty){ev.preventDefault();ev.returnValue='';}});
render();

</script>
</body>
